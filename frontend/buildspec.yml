version: 0.2

env:
  exported-variables:
    - COMMIT_HASH

cache:
  key: estime-pnpm-$(codebuild-hash-files 'frontend/pnpm-lock.yaml')
  paths:
    - 'frontend/node_modules/**/*'
    - '/root/.local/share/pnpm/store/**/*'
    - '/root/.npm/_cacache/**/*' # pnpm 캐싱

phases:
  pre_build:
    commands:
      - echo "=== Pre-Build ==="
      - export COMMIT_HASH=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}
      - 'echo "Resolved SHA (short): ${COMMIT_HASH}"'

  install:
    commands:
      - echo "=== Install Dependencies ==="
      - cd frontend
      # CI(.github/workflows/frontend-ci.yml)와 pnpm-lock.yaml(lockfileVersion 9.0)에 맞춘다.
      # 버전을 비우면 그날의 최신을 받아, 우리 코드가 그대로여도 pnpm 릴리스에 빌드가 깨진다.
      - npm install -g pnpm@9
      - pnpm install --frozen-lockfile

  build:
    commands:
      - echo "=== Build Project ==="
      - pnpm run build

  post_build:
    commands:
      - echo "=== Post-Build ==="
      - ls -al dist

artifacts:
  base-directory: frontend/dist
  files:
    - '**/*'
