spring:
  config:
    activate:
      on-profile: common
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

server:
  forward-headers-strategy: framework

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN}

logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    web:
      exposure:
        include: "health, info, prometheus, loggers"
  metrics:
    tags:
      application: estime-api
    distribution:
      # Grafana Cloud 무료 active series(10k) 한도 절약을 위해 히스토그램 버킷 비활성화
      # (요청 수·평균·최대 응답시간은 계속 수집됨, p95/p99 분포만 미수집)
      percentiles-histogram:
        http.server.requests: false
        jdbc.query: false

jdbc:
  datasource-proxy:
    logging: slf4j
    query:
      enable-logging: false
    slow-query:
      enable-logging: true
      log-level: WARN
      threshold: 1  # 초 단위
